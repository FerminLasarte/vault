[package]
name = "vault"
version = "1.2.1"
description = "Local-first personal finance manager"
authors = ["Fermín Lasarte <fermin.lasarte@icloud.com>"]
license = "MIT"
repository = "https://github.com/FerminLasarte/vault-ai"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "vault_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-sql = { version = "2.4.0", features = ["sqlite"] }
# The same sqlx the SQL plugin is built on, so the backup can run on the
# plugin's own connection pool rather than opening a second connection.
sqlx = { version = "0.8", default-features = false, features = ["sqlite"] }
tauri-plugin-dialog = "2.7.2"
base64 = "0.23.1"
tauri-plugin-window-state = "2.4.1"
tauri-plugin-notification = "2.3.3"
# Used by the updater flow to relaunch the app once the new version is in place.
tauri-plugin-process = "2"

# The updater does not build for mobile, and Tauri gates it by target for
# exactly that reason.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[profile.dev]
debug = "line-tables-only"
