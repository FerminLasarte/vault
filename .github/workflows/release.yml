name: Release

# Tauri cannot cross-compile: a Windows installer has to be built on Windows.
# This is what makes a .exe possible without owning a Windows machine.
on:
  push:
    tags:
      - "v*"
  # So a build can be produced without tagging, e.g. to hand someone a test copy.
  workflow_dispatch:

# Actions are pinned to commit SHAs, not tags: a tag can be repointed at
# new code by whoever owns the action, which would run inside our build
# and ship in the binaries users download. The trailing comment records
# which release each SHA corresponds to.

# Uploading the assets is the only write the run needs, because the draft
# release is created by hand beforehand -- see "Releasing" in the README. The
# repository keeps Actions read-only by default and this raises it no further
# than it has to, so a run with no draft waiting for it fails at the last step
# with `Resource not accessible by integration` rather than creating one.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            # One bundle that runs on both Apple Silicon and Intel, rather than
            # having to ask which Mac the person has.
            args: "--target universal-apple-darwin"
            rust-targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          - platform: windows-latest
            args: ""
            rust-targets: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # The notes travel with the tag instead of being typed into the release
      # form: the action copies this value into latest.json, and that is what an
      # installed copy shows in Ajustes. Notes added to the release page after
      # the build never reach anyone who already has the app.
      - name: Read the release notes
        id: notes
        shell: bash
        run: |
          # The HTML comment at the top of the file is a note to whoever
          # edits it, and Markdown hides it on the release page -- but the
          # card in Ajustes renders these notes as plain text, where it would
          # show up verbatim. Strip it, along with the blank lines it leaves.
          {
            echo 'body<<RELEASE_NOTES_EOF'
            sed '/<!--/,/-->/d' RELEASE_NOTES.md | sed '/./,$!d'
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update packages. Installed copies refuse any update that
          # is not signed by this key, so a tampered download cannot pose as a
          # new version.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Only a tag push publishes a release. Run manually and these stay
          # empty, so the action just builds and the installers come back as
          # run artifacts instead of a release named after a branch.
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('Vault {0}', github.ref_name) || '' }}
          releaseBody: ${{ steps.notes.outputs.body }}
          # A draft, so the release can be checked before anyone downloads it.
          # The action leaves the body of a draft alone, so the notes written
          # when the draft was created survive this run untouched.
          releaseDraft: true
          prerelease: false
          # The manifest installed copies poll to discover a new version. It is
          # attached to the release, so publishing the draft is what actually
          # offers the update to everyone.
          uploadUpdaterJson: true
          # A manual run has no tag and therefore no release to attach anything
          # to, so the installers come back as run artifacts instead. The action
          # has its own uploader for this, which is why there is no separate
          # upload-artifact step.
          uploadWorkflowArtifacts: ${{ github.event_name == 'workflow_dispatch' }}
          args: ${{ matrix.args }}
